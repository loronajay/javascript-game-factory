<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Circuit Track Viewer · Speed Demon</title>
  <link rel="stylesheet" href="circuit-track-viewer.css" />
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">Speed Demon · Real collision runtime</p>
        <h1>Circuit Track Viewer</h1>
        <p class="lede">Drive each finished map against its shipped road mask. The viewer uses the same vehicle step, footprint, and swept collision resolver as the game.</p>
      </div>
      <div class="controls" aria-label="Track controls">
        <label>Track <select id="track"></select></label>
        <button id="reset" type="button">Reset car</button>
        <label><input id="mask" type="checkbox" checked /> Collision edge</label>
        <label><input id="line" type="checkbox" /> CPU line</label>
        <label><input id="checkpoints" type="checkbox" /> Checkpoints</label>
      </div>
    </header>
    <section class="stage">
      <canvas id="viewer" width="1536" height="1024" aria-label="Driveable circuit map"></canvas>
      <div class="status" id="status">Loading track…</div>
    </section>
    <footer>
      <span><kbd>W</kbd>/<kbd>↑</kbd> gas</span>
      <span><kbd>S</kbd>/<kbd>↓</kbd> reverse/brake</span>
      <span><kbd>A</kbd><kbd>D</kbd>/<kbd>←</kbd><kbd>→</kbd> steer</span>
      <span><kbd>R</kbd> reset</span>
    </footer>
  </main>
  <script type="module" src="circuit-track-viewer.js"></script>
</body>
</html>
