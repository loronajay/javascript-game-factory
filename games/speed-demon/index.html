<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Speed Demon</title>
    <link rel="stylesheet" href="styles/game.css?v=mobile-intentional-v2-20260821" />
  </head>
  <body>
    <a href="../../grid.html" class="back-link">&larr; Arcade</a>
    <main class="stage">
      <canvas id="game" width="1280" height="720" aria-label="Speed Demon racing"></canvas>
    </main>
    <!-- Sets window.__JGF_PLATFORM_API_URL__ so the platform API client is
         configured. Must come before the entry module: the garage store and the
         records store both build their client at construction. Without it the
         base URL resolves empty off localhost, the garage silently never syncs
         and every global board reports OFFLINE. -->
    <script type="module" src="../../js/platform-config.mjs"></script>
    <script type="module">
      import { mountMobileController } from "../../js/mobile-controller.mjs";
      import { boot } from "./scripts/init-game.js";
      import {
        SPEED_DEMON_MOBILE_PROFILE,
        initMobileLandscapeGate,
        initMobilePlayShell,
        isTouchLike,
      } from "./scripts/mobile-ui.js";

      // The query switch makes the real phone shell available to a desktop
      // browser at a phone-sized viewport for visual QA.
      const forceMobileControls = new URLSearchParams(window.location.search).has("mobileControls");
      // Pass the shared controller an explicit answer because iPadOS can present
      // a desktop user agent even though it is still a touch-only device.
      const mobileControlsActive = forceMobileControls || isTouchLike(window);
      initMobileLandscapeGate({ force: mobileControlsActive });
      const mobileController = mountMobileController({
        profile: SPEED_DEMON_MOBILE_PROFILE,
        force: mobileControlsActive,
      });

      // Exposed so a run can be driven and inspected from the console.
      const game = boot(document.getElementById("game"), { mobile: mobileControlsActive });
      window.speedDemon = game;
      initMobilePlayShell({
        active: mobileControlsActive,
        controller: mobileController,
        getState: () => game.mobileState(),
      });
    </script>
  </body>
</html>
