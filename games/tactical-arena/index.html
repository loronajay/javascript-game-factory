<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#140d06">
    <title>Tactical Arena</title>
    <!-- Inline so there is no favicon request to 404 — the packaged app has no server to
         serve /favicon.ico, and the browser asks for one on every load regardless. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 4 6v10c0 7 5 12 12 14 7-2 12-7 12-14V6z' fill='%23140d06' stroke='%23c9a227' stroke-width='2'/%3E%3Cpath d='M16 9l3.2 6.5 7.1 1-5.1 5 1.2 7-6.4-3.4L9.6 28.5l1.2-7-5.1-5 7.1-1z' fill='%23c9a227'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&display=swap">
    <link rel="stylesheet" href="./styles/game.css">
  </head>
  <body>
    <template data-fragment-src="./html/global-paint-servers.html"></template>
    <a href="../../grid.html" class="back-link">&larr; Arcade</a>

    <div id="app">
      <template data-fragment-src="./html/app-chrome.html"></template>
      <template data-fragment-src="./html/menu-screens.html"></template>
      <template data-fragment-src="./html/campaign-screen.html"></template>
      <template data-fragment-src="./html/setup-screens.html"></template>
      <template data-fragment-src="./html/outcome-screens.html"></template>
      <template data-fragment-src="./html/match-screen.html"></template>
    </div>

    <template data-fragment-src="./html/field-manual.html"></template>
    <template data-fragment-src="./html/settings-modal.html"></template>

    <!-- Sets window.__JGF_PLATFORM_API_URL__ so the platform API client is configured.
         Must load before bootstrap.js (which creates API clients). Without it every
         platform call — ranked, activity, progression sync — silently no-ops. -->
    <script type="module" src="../../js/platform-config.mjs"></script>
    <script type="module" src="./src/bootstrap.js"></script>
  </body>
</html>
