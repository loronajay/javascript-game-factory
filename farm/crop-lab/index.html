<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crop Lab | The Farm</title>
  <style>
    :root { --bg: #16140f; --panel: #221e17; --line: #3a3326; --ink: #f1e6cf; --dim: #a8997b; --accent: #f2c14e; --new: #7fd46b; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; }
    body { display: grid; grid-template-columns: 250px 1fr; height: 100vh; overflow: hidden; }
    aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
    aside header { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
    aside h1 { margin: 0; font-size: 17px; letter-spacing: .04em; }
    aside header p { margin: 4px 0 0; color: var(--dim); font-size: 12px; }
    #list { overflow-y: auto; padding: 8px; flex: 1; }
    #list h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--dim); margin: 12px 8px 6px; }
    #list button { display: flex; justify-content: space-between; width: 100%; text-align: left; padding: 7px 10px; margin: 1px 0; border: 1px solid transparent; border-radius: 6px; background: none; color: var(--ink); font: inherit; cursor: pointer; }
    #list button:hover { background: #2d271d; }
    #list button[aria-pressed="true"] { border-color: var(--accent); background: #332a1a; }
    #list button small { color: var(--dim); }
    #list button.is-new small { color: var(--new); }
    main { position: relative; min-width: 0; }
    canvas { display: block; width: 100%; height: 100%; }
    .toolbar { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; pointer-events: none; }
    .toolbar > * { pointer-events: auto; }
    .toolbar button, .toolbar label { background: rgba(34,30,23,.88); border: 1px solid var(--line); color: var(--ink); border-radius: 6px; padding: 6px 10px; font: inherit; font-size: 13px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
    .toolbar button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
    #title { font-size: 20px; font-weight: 700; margin-right: auto; text-shadow: 0 1px 3px #000; }
    #stats { position: absolute; bottom: 12px; left: 12px; right: 12px; display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; pointer-events: none; }
    #stats div { background: rgba(34,30,23,.88); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font-size: 12px; color: var(--dim); }
    #stats b { color: var(--ink); display: block; font-size: 13px; }
    .hint { position: absolute; top: 52px; left: 12px; color: var(--dim); font-size: 12px; text-shadow: 0 1px 2px #000; pointer-events: none; }
    @media (max-width: 700px) { body { grid-template-columns: 1fr; grid-template-rows: 180px 1fr; } aside { border-right: 0; border-bottom: 1px solid var(--line); } }
  </style>
</head>
<body>
  <aside>
    <header>
      <h1>CROP LAB</h1>
      <p>Every growth stage of every crop model, on the same soil tiles the farm uses.</p>
    </header>
    <nav id="list"></nav>
  </aside>
  <main>
    <canvas id="view"></canvas>
    <div class="toolbar">
      <span id="title"></span>
      <button id="modeStages" aria-pressed="true">Growth stages</button>
      <button id="modeAll" aria-pressed="false">All crops (ripe)</button>
      <button id="fit" aria-pressed="true" title="Scale each model the way the farm plot does">In-game scale</button>
      <button id="wire" aria-pressed="false">Wireframe</button>
      <button id="spin" aria-pressed="false">Turntable</button>
    </div>
    <div class="hint">Drag to orbit · right-drag to pan · wheel to zoom · 1–4 focus a stage · ↑/↓ change crop</div>
    <div id="stats"></div>
  </main>
  <script type="module" src="./crop-lab.js"></script>
</body>
</html>
