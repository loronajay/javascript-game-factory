apply plugin: 'com.android.application'

// Release signing, driven by an untracked android/keystore.properties:
//
//   storeFile=../tactical-arena-upload.jks
//   storePassword=...
//   keyAlias=upload
//   keyPassword=...
//
// The keystore and that file are gitignored. Losing them means losing the ability to
// update the app on Play forever (Play App Signing can reset an UPLOAD key, but only via a
// support request), so back both up somewhere outside this repo.
//
// When the file is absent the release build type simply goes unsigned — debug builds and
// CI still work on a machine that has no signing material.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasReleaseSigning = keystorePropertiesFile.exists()
if (hasReleaseSigning) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = "com.jayarcade.tacticalarena"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.jayarcade.tacticalarena"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Play rejects a re-upload of a versionCode it has already seen, and the number can
        // never go down. Override per build without editing this file:
        //   gradlew.bat bundleRelease -PtaVersionCode=10 -PtaVersionName=1.0.7
        versionCode project.hasProperty('taVersionCode') ? project.taVersionCode.toInteger() : 11
        versionName project.hasProperty('taVersionName') ? project.taVersionName : "1.0.8"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // Capacitor and Play Billing publish consumer keep rules for reflective entry
            // points, so release builds can use the full supported R8 optimization pipeline.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    // Explicit (rather than relying on the appcompat/capacitor transitive) because
    // MainActivity imports WindowCompat / WindowInsetsControllerCompat directly for
    // the immersive full-screen setup.
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "com.android.billingclient:billing:8.2.0"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
